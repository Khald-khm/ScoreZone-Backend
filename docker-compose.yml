services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest

    container_name: scorezone-db

    restart: unless-stopped

    networks:
      - scorezone-network

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MyStrong@Pass123"
    
    ports:
      - "1433:1433"
    
    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -C || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  
  api:
    build:
      context: .
    
    container_name: scorezone-api

    restart: unless-stopped

    ports:
      - "8080:8080"
    
    depends_on:
      sqlserver:
        condition: service_healthy
    
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    
    networks:
      - scorezone-network
    
networks:
  scorezone-network: